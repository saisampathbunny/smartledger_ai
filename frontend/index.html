<!DOCTYPE html>
<html>

<head>

    <title>SmartLedger AI</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div class="container">


        <h1>SmartLedger AI</h1>


        <p class="description">
            Fraud Detection System
        </p>


        <h2>
            Add Transaction
        </h2>


        <form id="transactionForm">


            <label>
                Sender Account
            </label>

            <input
                type="text"
                id="sender"
                placeholder="Enter sender account"
            >


            <label>
                Receiver Account
            </label>

            <input
                type="text"
                id="receiver"
                placeholder="Enter receiver account"
            >


            <label>
                Amount
            </label>

            <input
                type="number"
                id="amount"
                placeholder="Enter amount"
            >


            <label>
                Transaction Type
            </label>

            <select id="type">

                <option value="TRANSFER">
                    TRANSFER
                </option>

                <option value="PAYMENT">
                    PAYMENT
                </option>

                <option value="WITHDRAWAL">
                    WITHDRAWAL
                </option>

                <option value="DEPOSIT">
                    DEPOSIT
                </option>

            </select>


            <button type="submit">
                Analyze Transaction
            </button>


        </form>


        <p id="message"></p>


        <div class="history">

            <h2>
                Transaction History
            </h2>


            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Sender</th>

                        <th>Receiver</th>

                        <th>Amount</th>

                        <th>Status</th>

                    </tr>

                </thead>


                <tbody id="transactionTable">

                </tbody>

            </table>

        </div>


        <footer>
            SmartLedger AI
        </footer>


    </div>


    <script src="script.js"></script>


</body>

</html>
